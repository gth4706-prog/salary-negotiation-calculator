<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>각잡살림 — 무료 웹 도구 바로가기</title>
<meta name="description" content="설치도 회원가입도 없이 브라우저에서 바로 쓰는 무료 도구 모음. 원하는 도구를 눌러 바로 이동하세요.">
<!-- ⚠️ 검색 색인 대상이 아니다. 허브(joeltool.com/)와 내용이 겹쳐 중복으로 잡히면
     양쪽 다 손해다. 이 페이지는 오직 인스타 프로필 링크 착지용이다. -->
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://joeltool.com/">
<meta property="og:type" content="website">
<meta property="og:title" content="각잡살림 — 무료 웹 도구 바로가기">
<meta property="og:description" content="원하는 도구를 눌러 바로 이동하세요. 설치도 회원가입도 없습니다.">
<meta property="og:url" content="https://joeltool.com/go/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<!-- ⚠️ 광고 스크립트를 넣지 않는다. 이 페이지의 목적은 오직 "빠르게 도구로 보내기"다.
     광고가 붙으면 로딩이 느려지고 첫 화면에서 도구가 밀려난다. -->
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0E1116; --card:#171C23; --card2:#1E242D;
    --line:#2A323D; --ink:#F2F5F9; --muted:#98A6B8;
    --font:"Pretendard Variable","Pretendard",system-ui,-apple-system,sans-serif;
  }
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);
    line-height:1.6;word-break:keep-all;letter-spacing:0;
    padding:0 16px calc(40px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto}

  header{text-align:center;padding:38px 0 22px}
  .logo{
    width:60px;height:60px;margin:0 auto 12px;border-radius:19px;
    background:linear-gradient(145deg,#2B3542,#171C23);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
  }
  .logo svg{width:34px;height:34px;color:#7FD6A8}
  h1{font-size:21px;margin:0 0 5px;font-weight:800;letter-spacing:-.02em}
  .tag{font-size:14px;color:var(--muted);margin:0}

  /* 이번에 밀고 있는 도구 — 맨 위에 하나만 크게 */
  .featured{
    display:block;margin:20px 0 8px;padding:18px 18px 16px;
    border-radius:18px;text-decoration:none;color:#fff;
    background:linear-gradient(140deg, var(--c), color-mix(in srgb,var(--c) 62%, #000));
    box-shadow:0 10px 30px color-mix(in srgb,var(--c) 32%, transparent);
    position:relative;overflow:hidden;
  }
  .featured::after{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(52deg,rgba(255,255,255,.06) 0 3px,transparent 3px 26px);
    pointer-events:none;
  }
  .featured .new{
    display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;
    background:rgba(255,255,255,.22);border-radius:999px;padding:4px 10px;margin-bottom:9px;
  }
  .featured .ft{font-size:19px;font-weight:800;letter-spacing:-.02em;display:flex;gap:9px;align-items:center}
  .featured .fd{font-size:13.5px;opacity:.93;margin-top:5px;line-height:1.55}

  .sect{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:22px 4px 9px}

  /* 도구 버튼 — 손가락 하나로 누르는 게 목표라 크게 잡는다(높이 68px 이상) */
  a.item{
    display:flex;align-items:center;gap:13px;
    padding:15px 14px;margin-bottom:9px;
    background:var(--card);border:1px solid var(--line);border-radius:15px;
    text-decoration:none;color:var(--ink);
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  a.item:active{transform:scale(.983);background:var(--card2)}
  a.item:hover{border-color:color-mix(in srgb,var(--c) 60%,transparent)}
  /* 공개 도구 번호 — 카드뉴스에서 "N번"으로 안내하므로 여기서 바로 찾을 수 있어야 한다.
     ⚠️ 한 번 부여한 번호는 절대 바꾸지 않는다. 이미 올린 인스타 게시물이 그 번호를
        가리키고 있기 때문이다. 새 도구는 다음 번호를 받고, 도구를 내려도
        그 번호를 다른 도구에 재사용하지 않는다. */
  .no{
    flex:none;width:32px;text-align:center;
    font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;
    color:var(--c);letter-spacing:-.02em;
  }
  .ico{
    flex:none;width:46px;height:46px;border-radius:13px;
    display:flex;align-items:center;justify-content:center;font-size:23px;
    background:color-mix(in srgb,var(--c) 17%,transparent);
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent);
  }
  /* ⚠️ .tt/.td 는 span 이라 기본이 inline 이다. display:block 을 안 주면
     도구 이름과 설명이 한 줄로 붙어버린다(2026-08-04 실제로 그렇게 나왔다). */
  .tx{min-width:0;flex:1}
  .tt{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.01em}
  .td{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
  .go{flex:none;color:var(--muted);font-size:17px}
  a.item:hover .go{color:var(--c)}

  footer{text-align:center;margin-top:26px;font-size:12px;color:var(--muted);line-height:1.9}
  footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
  .site-link{
    display:block;margin:18px 0 4px;padding:14px;text-align:center;
    border:1px dashed var(--line);border-radius:14px;
    color:var(--muted);text-decoration:none;font-size:13.5px;
  }
  .site-link b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">
      <svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="17" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="2.3" fill="currentColor"/><path d="M20 8 L23.4 20 L20 32 L16.6 20 Z" fill="currentColor"/></svg>
    </div>
    <h1>각잡살림</h1>
    <p class="tag">설치도 회원가입도 없이 바로 쓰는 무료 도구</p>
    <p class="tag" style="font-size:12.5px;margin-top:5px;opacity:.72">각 잡고 만든 도구 셋</p>
  </header>

  <!-- 이번에 소개 중인 도구. 새 도구를 낼 때마다 여기만 바꾸면 된다. -->
  <a class="featured" style="--c:#0E7C5A" href="../my-pay/">
    <span class="new">NEW</span>
    <div class="ft"><span>💵</span><span>내 월급 한 장</span></div>
    <div class="fd">월급과 입사일만 넣으면 실수령액·4대보험·퇴직금·연차·실업급여·통상시급이 한 화면에 전부 나와요</div>
  </a>

  <a class="item" style="--c:#2E6F9E" href="../room-planner/">
    <span class="ico">🛋️</span>
    <span class="tx"><span class="tt">방 가구 배치</span><span class="td">이사 전에 침대가 들어가는지 끌어보며 확인</span></span>
    <span class="go">→</span>
  </a>

  <a class="item" style="--c:#FF4B3E" href="../fishing-tide/">
    <span class="ico">🎣</span>
    <span class="tx"><span class="tt">낚시 물때</span><span class="td">갯바위 포인트 1,076곳 · 물때와 만조·간조 시각</span></span>
    <span class="go">→</span>
  </a>

  <a class="site-link" href="../">각잡살림 <b>홈</b>으로 →</a>

  <footer>
    <a href="../about.html">소개</a> · <a href="../contact.html">문의</a> · <a href="../privacy.html">개인정보처리방침</a>
    <div>© 각잡살림</div>
  </footer>

</div>
<!-- Cloudflare Web Analytics — 쿠키를 쓰지 않고 개인을 식별하지 않는다.
     이 토큰은 공개 페이지에 심으라고 만들어진 클라이언트 식별자다(비밀값 아님).
     ⚠️ 자동 설치(auto_install)가 켜져 있었지만 실제로는 비콘이 주입되지 않아
        수집이 0이었다(2026-08-05 확인). 그래서 직접 심는다. -->
</body>
</html>
