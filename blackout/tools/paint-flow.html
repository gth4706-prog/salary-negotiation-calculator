<!doctype html><html lang="ko"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLACKOUT 페인트 번짐</title><link rel="stylesheet" href="css/rooms.css?v=1.2-art7"><link rel="stylesheet" href="css/motion.css?v=1.2-art7"><style>*{box-sizing:border-box}body{margin:0;background:#111715;color:#eee8db;font:16px/1.7 system-ui}main{max-width:900px;margin:40px auto;padding:24px}h1{font-size:30px}p{color:#b6c0b8}button{padding:12px 18px;background:#2a3b35;border:1px solid #738e7f;border-radius:12px;color:#eee8db;font:inherit;cursor:pointer;margin:4px}.board{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:auto;aspect-ratio:3;gap:0;border:0;border-radius:12px;overflow:hidden;box-shadow:none;margin:28px 0}.board:before,.board:after{display:none}.cell{position:relative;min-width:0;min-height:0}.cell .art{opacity:0}.hint{font-size:14px}a{color:#9ed9c1}</style></head><body><main><h1>철퍽, 그리고 스며들며 하나로.</h1><p>① 한 발을 쏜 뒤 ② 옆에 쏴보세요. 세 번째 칸은 칠하지 않아 계속 숨겨집니다.</p><button id="one">① 한 발</button><button id="two">② 옆에 한 발</button><button id="reset">다시 보기</button><div class="board" id="field"></div><p class="hint">실제 게임의 페인트 표시와 번짐 코드를 사용합니다. 기기의 모션 감소 설정이 켜져 있으면 최종 모습이 바로 표시됩니다.</p><a href="index.html">게임으로 돌아가기</a></main><script src="js/svgart.js"></script><script src="js/art.js?v=1.2-art7"></script><script src="js/motion.js?v=1.2-art7"></script><script>
BO.SvgArt.install(document.body);BO.Art.globals();var board=document.getElementById('field'),cells=[],paint={};board.style.setProperty('--n','3');BO.Art.floor(board,'office');for(var x=0;x<3;x++){var c=document.createElement('div');c.className='cell known k-floor';c.dataset.x=x;c.dataset.y=0;c.style.setProperty('--fx',(x*50)+'%');c.style.setProperty('--fy','50%');c.innerHTML='<span class="art"></span><span class="splat hide"><i class="halo"></i><i class="shape"><b class="pic"></b><b class="tint"></b><b class="edge"></b></i></span><span class="reaction"></span>';board.appendChild(c);BO.Art.tile(c,{kind:'floor',w:1,h:1,ox:0,oy:0},'office');cells.push(c);}
function shot(x){if(paint[(x+1)+',1'])return;paint[(x+1)+',1']={age:0};for(var i=0;i<3;i++){if(!paint[(i+1)+',1'])continue;var sp=cells[i].querySelector('.splat');sp.className='splat mine paint-field';BO.Motion.paint(sp,i+1,1,paint,5,3);}BO.Motion.impact(cells[x],'wood',true);paint[(x+1)+',1'].age=1;}
document.getElementById('one').onclick=function(){shot(0)};document.getElementById('two').onclick=function(){if(!paint['1,1'])shot(0);shot(1)};document.getElementById('reset').onclick=function(){BO.Motion.clear(board);paint={};cells.forEach(function(c){c.querySelector('.splat').className='splat hide'})};
</script></body></html>
