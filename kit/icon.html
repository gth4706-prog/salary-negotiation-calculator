<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>프로필 아이콘 생성기 — 각잡살림 내부용</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Pretendard Variable",system-ui,sans-serif;background:#14161A;color:#E9EEF5;line-height:1.6}
  header{padding:20px 24px;border-bottom:1px solid #2A3341}
  h1{font-size:17px;margin:0 0 4px;font-weight:800}
  .muted{color:#93A1B4;font-size:13px}
  main{padding:24px;display:flex;gap:22px;flex-wrap:wrap}
  figure{margin:0;text-align:center}
  canvas{width:200px;height:200px;border-radius:24px;display:block;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  /* 인스타는 아이콘을 원형으로 자른다 — 잘린 모습도 같이 보여준다 */
  .circle canvas{border-radius:50%}
  figcaption{font-size:12.5px;color:#93A1B4;margin-top:8px}
  button{font:inherit;font-size:12.5px;margin-top:7px;border-radius:8px;border:1px solid #3A4757;background:#1E2733;color:#E9EEF5;padding:7px 12px;cursor:pointer}
  button:hover{border-color:#3DD68C;color:#3DD68C}
  .note{padding:0 24px 30px;font-size:13px;color:#93A1B4;max-width:760px}
</style>
</head>
<body>
<header>
  <h1>🎨 프로필 아이콘 생성기</h1>
  <p class="muted">1080×1080 · 마음에 드는 걸 골라 저장하세요. 인스타는 원형으로 잘라서 보여줍니다.</p>
</header>
<main id="sheet"></main>
<p class="note">
  ⚠️ 프로필 아이콘은 실제로는 <b>32~64px</b> 크기로 보입니다. 그래서 가는 선·작은 글자는
  다 뭉개집니다. 아래 시안들은 전부 <b>굵은 형태 + 높은 대비</b>로만 만들었고,
  원형으로 잘려도 핵심이 안 잘리게 안전 여백을 뒀습니다.
</p>

<script>
/* =========================================================
   프로필 아이콘 — 캔버스로 직접 그린다(카드뉴스 생성기와 같은 방식).
   ⚠️ document.fonts.ready 뒤에 그려야 Pretendard 로 찍힌다.
   ⚠️ 인스타 프로필은 원형 크롭이다. 모서리에 중요한 요소를 두지 않는다.
   브랜드 뜻: "각 잡고 만든 살림" — 각(角)과 나침반(방향을 잡아준다)에서 모티프를 땄다.
   ========================================================= */
var S = 1080, C = S/2;

/* 사이트 nav 에 쓰는 브랜드 마크(원 + 바늘)를 아이콘용으로 굵게 다시 그린다 */
function needle(ctx, cx, cy, r, color, bg){
  // 바깥 링
  ctx.strokeStyle = color; ctx.lineWidth = r*0.13; ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
  // 바늘(마름모)
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(cx, cy - r*0.72);
  ctx.lineTo(cx + r*0.30, cy);
  ctx.lineTo(cx, cy + r*0.72);
  ctx.lineTo(cx - r*0.30, cy);
  ctx.closePath(); ctx.fill();
  // 가운데 구멍
  ctx.fillStyle = bg; ctx.beginPath();
  ctx.arc(cx, cy, r*0.115, 0, Math.PI*2); ctx.fill();
}

var VARIANTS = [
  {
    id:"needle-green", label:"A. 나침반 · 딥그린",
    draw:function(ctx){
      var g=ctx.createLinearGradient(0,0,S,S); g.addColorStop(0,"#22694E"); g.addColorStop(1,"#12352A");
      ctx.fillStyle=g; ctx.fillRect(0,0,S,S);
      needle(ctx, C, C, S*0.30, "#F2EFE6", "#17513C");
    }
  },
  {
    id:"needle-cream", label:"B. 나침반 · 크림 배경",
    draw:function(ctx){
      ctx.fillStyle="#F4F0E6"; ctx.fillRect(0,0,S,S);
      needle(ctx, C, C, S*0.30, "#1F5E45", "#F4F0E6");
    }
  },
  {
    id:"gak-square", label:"C. 각(角) 자 · 직각",
    draw:function(ctx){
      ctx.fillStyle="#12181F"; ctx.fillRect(0,0,S,S);
      // 직각자 형태 — "각 잡는다"를 직접 형상화
      ctx.strokeStyle="#3DD68C"; ctx.lineWidth=S*0.075; ctx.lineCap="square";
      ctx.beginPath();
      ctx.moveTo(S*0.30, S*0.26);
      ctx.lineTo(S*0.30, S*0.72);
      ctx.lineTo(S*0.74, S*0.72);
      ctx.stroke();
      // 직각 표시(작은 사각)
      ctx.strokeStyle="#F2F5F9"; ctx.lineWidth=S*0.032;
      ctx.strokeRect(S*0.345, S*0.615, S*0.10, S*0.10);
    }
  },
  {
    id:"text-mark", label:"D. 글자 · 각",
    draw:function(ctx){
      var g=ctx.createLinearGradient(0,0,0,S); g.addColorStop(0,"#2F6F4E"); g.addColorStop(1,"#1B4433");
      ctx.fillStyle=g; ctx.fillRect(0,0,S,S);
      ctx.fillStyle="#F6F2E8";
      ctx.font="800 560px 'Pretendard Variable',sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText("각", C, C+14);
    }
  }
];

var sheet=document.getElementById("sheet");

function render(){
  VARIANTS.forEach(function(v){
    [false,true].forEach(function(circle){
      var fig=document.createElement("figure");
      if(circle) fig.className="circle";
      var cv=document.createElement("canvas");
      cv.width=S; cv.height=S;
      v.draw(cv.getContext("2d"));
      var cap=document.createElement("figcaption");
      cap.textContent = v.label + (circle ? " (원형 크롭)" : "");
      fig.appendChild(cv); fig.appendChild(cap);
      if(!circle){
        var b=document.createElement("button");
        b.textContent="PNG 저장";
        b.addEventListener("click", function(){
          cv.toBlob(function(blob){
            var a=document.createElement("a");
            a.href=URL.createObjectURL(blob);
            a.download="gakjabsalim-icon-"+v.id+".png";
            a.click();
            setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
          },"image/png");
        });
        fig.appendChild(b);
      }
      sheet.appendChild(fig);
    });
  });
}
document.fonts.ready.then(render);
</script>
</body>
</html>
