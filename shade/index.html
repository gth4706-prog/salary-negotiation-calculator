<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>미친 폭염 그늘 쟁탈전 — 각잡살림</title>
<meta name="description" content="얼음이 되어 그늘을 뺏는 실시간 웹게임. 햇볕에선 녹고 그늘에선 버틴다. 정오가 되면 그늘이 사라진다. 설치도 로그인도 없이 바로.">
<meta name="theme-color" content="#8A4A46">
<link rel="canonical" href="https://joeltool.com/shade/">
<meta property="og:type" content="website">
<meta property="og:title" content="미친 폭염 그늘 쟁탈전">
<meta property="og:description" content="햇볕에선 녹고 그늘에선 버틴다. 정오가 되면 그늘이 사라진다.">
<meta property="og:url" content="https://joeltool.com/shade/">
<link rel="stylesheet" href="a/0.04/css/style.css">
</head>
<body>

<canvas id="game"></canvas>

<div id="lobby">
  <div class="card">
    <h1>미친 폭염 그늘 쟁탈전</h1>
    <p class="tag">얼음이 되어 그늘을 뺏는 게임</p>
    <ul class="rules">
      <li><b>햇볕</b>에 있으면 계속 <b>녹는다</b>. <b>그늘</b>에선 안 녹는다</li>
      <li>바닥의 <b>얼음조각</b>을 먹으면 커진다 — 조각도 그늘에 쌓인다</li>
      <li>나보다 <b>작은 얼음</b>은 먹고, <b>빨간 고리</b>가 뜬 얼음은 도망친다</li>
    </ul>
    <div class="row">
      <input id="nick" maxlength="12" autocomplete="off" aria-label="닉네임">
      <button id="reroll" class="ghost" type="button">새로 뽑기</button>
    </div>
    <button id="play" class="go" type="button">시작</button>
    <p class="how">끌어서 이동 · 버튼 하나로 냉기 분사<br>PC는 마우스 방향으로 이동 · 클릭이나 스페이스</p>
    <p class="ver">v0.04</p>
  </div>
</div>

<button id="gear" type="button" aria-label="설정">⚙</button>

<div id="sheet" class="gone">
  <label><input type="checkbox" id="cb"> 색약 모드 — 모양을 크게, 색 대신 밝기로</label>
  <label><input type="checkbox" id="lite"> 가볍게 — 연출을 끄고 프레임을 확보</label>
  <p class="perf" id="perf">성능 측정 중…</p>
  <p class="note">봇은 이름표에 <b>봇</b>이라고 적혀 있습니다. 사람인 척하지 않습니다.</p>
  <a href="/">각잡살림의 다른 도구</a>
</div>

<div id="status" class="gone"></div>

<script type="module" src="a/0.04/js/game.js"></script>
</body>
</html>
