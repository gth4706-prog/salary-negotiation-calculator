<!doctype html><html lang="ko"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLACKOUT 캐릭터 동작</title><link rel="stylesheet" href="css/rooms.css?v=1.3-art10"><link rel="stylesheet" href="css/motion.css?v=1.3-art10"><link rel="stylesheet" href="css/actors.css?v=1.3-art10"><style>*{box-sizing:border-box}body{margin:0;background:#111715;color:#eee6d4;font:16px/1.65 system-ui}main{max-width:1050px;margin:auto;padding:32px 24px}h1{margin:8px 0;font-size:32px}p{color:#b9c4b9}small{color:#d6b471;letter-spacing:.12em}.lineup{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0}.card{background:#1d2722;border:1px solid #39433d;border-radius:16px;padding:15px;text-align:center}.sample{height:175px;position:relative}.sample .cell{width:160px;height:160px;position:absolute;left:50%;top:0;transform:translateX(-50%);background:none}.board{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:330px;height:330px;position:relative;border:0;overflow:visible;background:url(assets/rooms/office.jpg) center/cover;border-radius:12px}.board:before,.board:after{display:none}.board .cell{min-width:0;min-height:0;background:transparent;border:1px solid #fff1}.demo{display:flex;align-items:center;gap:40px;padding:25px;background:#19221e;border-radius:18px}.controls{display:flex;flex-wrap:wrap;gap:8px;max-width:330px}button{font:inherit;color:#e6eee5;background:#2c4238;border:1px solid #809889;border-radius:10px;padding:10px 15px;cursor:pointer}a{color:#9bd6bb}.note{font-size:14px}@media(max-width:640px){.lineup{grid-template-columns:repeat(2,1fr)}.demo{flex-direction:column;padding:15px}.board{width:285px;height:285px}.sample .cell{width:135px;height:150px}.sample{height:155px}}</style></head><body><main><small>BLACKOUT · CHARACTER / 02</small><h1>돌아서고, 한 걸음. 그리고 철퍽.</h1><p>새 방향별 원화와 이동·발사·피격을 게임에 연결했습니다.</p><section class="lineup"><article class="card">앞<div class="sample" data-face="2"></div></article><article class="card">오른쪽<div class="sample" data-face="1"></div></article><article class="card">뒤<div class="sample" data-face="0"></div></article><article class="card">왼쪽<div class="sample" data-face="3"></div></article></section><section class="demo"><div class="board" id="stage"></div><div><div class="controls"><button data-dir="0">↑ 이동</button><button data-dir="1">→ 이동</button><button data-dir="2">↓ 이동</button><button data-dir="3">← 이동</button><button id="shot">발사</button><button id="hurt">피격</button></div><p class="note">게임과 동일한 그림·모션입니다.<br>이동은 원화를 이용한 짧은 이동과 착지 표현이며,<br>왼쪽은 오른쪽 원화를 뒤집어 사용합니다.</p><a href="index.html">실제 게임 열기</a></div></section></main><script src="js/svgart.js"></script><script src="js/art.js?v=1.3-art10"></script><script src="js/motion.js?v=1.3-art10"></script><script src="js/sfx.js"></script><script>
BO.SvgArt.install(document.body);BO.Art.globals();function contents(){return '<span class="splat hide"></span><span class="glowfx"></span><span class="reaction"></span>'}document.querySelectorAll('.sample').forEach(function(s){var c=document.createElement('div');c.className='cell me';c.dataset.face=s.dataset.face;c.innerHTML=contents();s.appendChild(c)});var board=document.getElementById('stage'),cells=[],pos=4;for(var i=0;i<9;i++){var c=document.createElement('div');c.className='cell';c.innerHTML=contents();c.dataset.x=i%3;c.dataset.y=Math.floor(i/3);board.appendChild(c);cells.push(c)}cells[pos].classList.add('me');cells[pos].dataset.face=2;document.querySelectorAll('[data-dir]').forEach(function(b){b.onclick=function(){var d=Number(b.dataset.dir),dx=[0,1,0,-1][d],dy=[-1,0,1,0][d],x=pos%3+dx,y=Math.floor(pos/3)+dy;cells[pos].dataset.face=d;if(x<0||x>2||y<0||y>2)return;BO.Motion.clear(board);cells[pos].classList.remove('me');cells[pos].removeAttribute('data-face');pos=y*3+x;cells[pos].classList.add('me');cells[pos].dataset.face=d;BO.Motion.walk(cells[pos],dx,dy)}});document.getElementById('shot').onclick=function(){BO.Motion.shoot(board);BO.Sfx.play('shot')};document.getElementById('hurt').onclick=function(){cells[pos].querySelector('.splat')._paintTone=210;BO.Motion.hurt(cells[pos]);BO.Motion.impact(cells[pos],'fabric',false);BO.Sfx.play('splat')};
</script></body></html>
