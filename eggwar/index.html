     기종별 레이아웃 사고의 원인을 제거하는 것이 목적이다.
     viewport-fit=cover 는 일부러 넣지 않는다: 노치 아래로 캔버스가 파고들면
     letterbox 계산이 또 어긋난다. standalone 만으로 주소창 문제는 해결된다. -->

<div id="game"></div>
<div id="ver">v1.69</div>

    <div id="rotate-icon">📱</div>
    <h1>가로로 돌려주세요</h1>

    <button id="rotate-fs" type="button" hidden>⛶ 전체화면으로 시작</button>
  </div>
</div>

<!-- 무결성 검증(SRI). 이 파일만 남의 서버(CDN)에서 온다 — CDN 이 뚫리거나 중간에서
     바뀌면 우리 게임 안에서 남의 코드가 그대로 돌고 localStorage(닉네임·기록)도 읽힌다.
     해시가 1바이트라도 다르면 브라우저가 실행을 거부한다. 두 번 내려받아 동일함을 확인한 값이다.
     ⚠ Phaser 버전을 올리면 해시도 반드시 다시 계산할 것 — 안 그러면 게임이 통째로 안 뜬다.
     계산: curl -sL <url> | openssl dgst -sha384 -binary | openssl base64 -A -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"
        integrity="sha384-Fi7F0CYQBHYa+s2vvYJeiqvOQf3tuZ28vafRGXvMt7ijxNTVf3+eXPkNRIUi9JD2"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
