<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ⚠️ 내부 제작 도구다. 검색에 잡히면 안 된다(sitemap 에도 넣지 않음). -->
<meta name="robots" content="noindex,nofollow">
<title>인스타 카드뉴스 생성기 — 각잡살림 내부용</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root{ --font:"Pretendard Variable","Pretendard",system-ui,sans-serif }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);background:#14161A;color:#E9EEF5;line-height:1.6}
  header{padding:20px 24px;border-bottom:1px solid #2A3341;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:800}
  .muted{color:#93A1B4;font-size:13px}
  select,button{font:inherit;font-size:14px;border-radius:8px;border:1px solid #3A4757;background:#1E2733;color:#E9EEF5;padding:9px 13px;cursor:pointer}
  button.primary{background:#3DD68C;border-color:#3DD68C;color:#08130D;font-weight:800}
  button:hover{border-color:#3DD68C}
  main{padding:24px}
  .sheet{display:flex;gap:16px;flex-wrap:wrap}
  figure{margin:0}
  figcaption{font-size:12px;color:#93A1B4;padding:6px 2px}
  canvas{width:270px;height:270px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:block}
  .caption-box{margin-top:26px;background:#1A222C;border:1px solid #2A3341;border-radius:10px;padding:16px 18px}
  .caption-box h2{font-size:14px;margin:0 0 10px}
  textarea{width:100%;min-height:210px;font:inherit;font-size:13.5px;line-height:1.75;background:#0F1319;color:#E9EEF5;border:1px solid #2A3341;border-radius:8px;padding:13px;resize:vertical}
  .note{font-size:12.5px;color:#93A1B4;margin-top:10px}
  /* 모바일(태현님은 폰에서 저장해 바로 올린다) — 캔버스가 화면을 넘지 않게 */
  @media (max-width:560px){
    header{padding:14px 16px;gap:9px}
    h1{font-size:15px;width:100%}
    select{max-width:100%;flex:1}
    main{padding:16px}
    .stagebar{padding:11px 16px;gap:6px}
    .chip{font-size:12px;padding:6px 11px}
    .sheet{gap:12px;justify-content:center}
    canvas{width:min(46vw,220px);height:min(46vw,220px)}
    .caption-box{padding:13px 14px}
    textarea{min-height:260px;font-size:13px}
  }
  /* 퍼널 단계 필터 — 내부 관리용 라벨이라 카드 이미지에는 안 들어간다 */
  .stagebar{display:flex;gap:7px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid #2A3341}
  .chip{font:inherit;font-size:12.5px;font-weight:700;border-radius:999px;
        border:1px solid #3A4757;background:transparent;color:#93A1B4;padding:6px 13px;cursor:pointer}
  .chip.on{background:#1E2733;color:#E9EEF5}
  .stagenote{font-size:12px;color:#6E7C8E;padding:0 24px 12px}
</style>
</head>
<body>

<header>
  <h1>📱 인스타 카드뉴스 생성기</h1>
  <select id="tool"></select>
  <button class="primary" id="dl">전체 PNG 저장</button>
  <span class="muted" id="status">1080×1080 · 도구 테마색 자동 적용</span>
</header>

<div id="stagebar" class="stagebar"></div>

<main>
  <div class="sheet" id="sheet"></div>

  <div class="caption-box">
    <h2>인스타 캡션 (복사해서 쓰세요)</h2>
    <textarea id="cap" spellcheck="false"></textarea>
    <p class="note">해시태그는 도구별로 자동 구성됩니다. 링크는 프로필 링크로 유도하는 게 인스타에서 유일하게 작동하는 방식이라, 캡션에는 "프로필 링크" 문구를 넣었습니다.</p>
  </div>
</main>

<script src="card-data.js?v=3"></script>
<script src="story-data.js?v=3"></script>
<script>
/* =========================================================
   카드 렌더링 — 캔버스에 직접 그린다.
   외부 라이브러리(html2canvas 등)를 쓰지 않는 이유: 이 사이트는 외부 스크립트를
   최소로 유지하고, 캔버스로 그리면 PNG 저장이 toBlob 한 줄로 끝나기 때문.
   ⚠️ 웹폰트가 로드되기 전에 그리면 기본 폰트로 찍힌다 —
      반드시 document.fonts.ready 를 기다린 뒤 그릴 것.
   ========================================================= */
var S = 1080;                 // 인스타 정사각 권장 해상도
var PAD = 96;

/* ⚠️ 데이터 파일(card-data.js / story-data.js)이 안 실리면 예전에는 스크립트가
   ReferenceError 로 죽으면서 **화면이 그냥 하얗게/까맣게 비었다.** 왜 안 되는지
   알 방법이 없다. 그래서 실패를 눈에 보이게 만든다(2026-08-05 모바일에서 실제 발생). */
function showFatal(msg){
  var box = document.getElementById("sheet") || document.body;
  box.innerHTML =
    '<div style="padding:18px;border:1px solid #C4636C;border-radius:10px;'
    + 'background:#2A1618;color:#F3D8DA;font-size:14px;line-height:1.75;max-width:640px">'
    + '<b>카드를 불러오지 못했어요</b><br>' + msg
    + '<br><br>· 새로고침을 한 번 해보세요(주소 끝에 <b>?v=2</b> 를 붙이면 캐시를 무시합니다).'
    + '<br>· 그래도 안 되면 이 화면을 그대로 보여주세요.'
    + '</div>';
}
if (typeof CARD_TOOLS === "undefined" || typeof CARD_STORIES === "undefined") {
  showFatal("데이터 파일을 읽지 못했습니다 (card-data.js / story-data.js).");
  throw new Error("card data not loaded");
}

function wrap(ctx, text, maxW){
  /* 한글은 어절 단위로 끊어야 읽기 좋다(글자 단위 금지). */
  var out = [];
  text.split("\n").forEach(function(para){
    var words = para.split(" "), line = "";
    words.forEach(function(w){
      var test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; }
      else line = test;
    });
    out.push(line);
  });
  return out;
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function drawCard(cv, tool, idx){
  var ctx = cv.getContext("2d");
  cv.width = S; cv.height = S;
  var isCover = idx === 0;
  var isLast  = idx === tool.cards.length;   // 마지막 = CTA 카드

  /* 배경 */
  ctx.fillStyle = isCover ? tool.color : tool.paper;
  ctx.fillRect(0,0,S,S);

  /* 표지: 대각선 결 — 단조로운 단색을 피한다 */
  if (isCover){
    ctx.save(); ctx.globalAlpha = .07; ctx.strokeStyle = "#fff"; ctx.lineWidth = 26;
    for (var i=-S; i<S*2; i+=90){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i-S,S); ctx.stroke(); }
    ctx.restore();
  }

  var ink = isCover ? "#FFFFFF" : tool.ink;

  /* 상단 브랜드 바 —
     ⚠️ 도메인(joeltool.com)을 넣지 않는다. 태현님 요청: 이름은 쓰되 노출은 원치 않음.
        대신 공개 번호를 붙여 "프로필 링크 → N번"으로 찾게 만든다. */
  ctx.fillStyle = isCover ? "rgba(255,255,255,.85)" : tool.color;
  ctx.font = "800 30px 'Pretendard Variable',sans-serif";
  ctx.textBaseline = "top";
  ctx.fillText(tool.kind === "story" ? "각잡살림  ·  " + tool.name
                                     : "각잡살림  ·  " + tool.no + "번 도구", PAD, PAD - 24);

  if (isCover){
    /* 표지 = 후킹 문장 */
    ctx.font = "700 120px 'Pretendard Variable',sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.28)";
    ctx.fillText(tool.emoji, PAD, PAD + 40);

    ctx.fillStyle = "#fff";
    ctx.font = "800 88px 'Pretendard Variable',sans-serif";
    var lines = wrap(ctx, tool.hook, S - PAD*2);
    var y = S/2 - (lines.length*112)/2 + 20;
    lines.forEach(function(l){ ctx.fillText(l, PAD, y); y += 112; });

    ctx.font = "500 40px 'Pretendard Variable',sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.fillText(tool.sub, PAD, y + 18);

    ctx.font = "800 34px 'Pretendard Variable',sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.95)";
    ctx.fillText(tool.name, PAD, S - PAD - 26);
    return;
  }

  var card = tool.cards[idx-1];

  /* 번호 뱃지 */
  ctx.fillStyle = tool.color;
  roundRect(ctx, PAD, PAD + 66, 96, 56, 28); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.font = "800 30px 'Pretendard Variable',sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(idx + " / " + tool.cards.length, PAD + 48, PAD + 80);
  ctx.textAlign = "left";

  /* 소제목 */
  ctx.fillStyle = ink;
  ctx.font = "800 62px 'Pretendard Variable',sans-serif";
  var th = wrap(ctx, card.t, S - PAD*2);
  var ty = PAD + 168;
  th.forEach(function(l){ ctx.fillText(l, PAD, ty); ty += 78; });

  /* 강조선 */
  ctx.fillStyle = tool.color;
  ctx.fillRect(PAD, ty + 14, 108, 8);

  /* 본문 */
  ctx.font = "500 46px 'Pretendard Variable',sans-serif";
  ctx.fillStyle = ink;
  var by = ty + 74;
  wrap(ctx, card.b, S - PAD*2).forEach(function(l){ ctx.fillText(l, PAD, by); by += 70; });

  /* 마지막 카드.
     ⚠️ 소재(story) 카드에는 **도구 CTA 를 넣지 않는다.** 1단계 전략이
        "소재로만 후킹"이기 때문이다. 대신 질문으로 끝내 댓글·저장을 유도한다
        (인스타에서 노출을 키우는 건 결국 반응이다). */
  if (isLast && tool.kind === "story"){
    ctx.fillStyle = tool.color;
    roundRect(ctx, PAD, S - PAD - 172, S - PAD*2, 160, 24); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.font = "800 40px 'Pretendard Variable',sans-serif";
    var qy = S - PAD - 142;
    wrap(ctx, tool.ask, S - PAD*2 - 70).forEach(function(l){ ctx.fillText(l, S/2, qy); qy += 54; });
    ctx.textAlign = "left";
  } else if (isLast){
    ctx.fillStyle = tool.color;
    roundRect(ctx, PAD, S - PAD - 128, S - PAD*2, 116, 24); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    /* ⚠️ 도메인만 크게 적으면 보는 사람이 주소창에 직접 쳐야 한다 — 대부분 그러지 않는다.
       인스타에서 실제로 눌리는 유일한 경로인 "프로필 링크"로 안내한다
       (프로필 웹사이트 칸에 넣어둔 링크인바이오 페이지 /go/). */
    ctx.font = "800 40px 'Pretendard Variable',sans-serif";
    ctx.fillText("프로필 링크 → " + tool.no + "번", S/2, S - PAD - 100);
    ctx.font = "600 26px 'Pretendard Variable',sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.fillText("프로필 상단 링크에서 " + tool.no + "번을 눌러주세요", S/2, S - PAD - 54);
    ctx.textAlign = "left";
  } else {
    ctx.fillStyle = tool.color;
    ctx.font = "700 30px 'Pretendard Variable',sans-serif";
    ctx.fillText(tool.name, PAD, S - PAD - 8);
  }
}

var TAGS = {
  "salary-calculator":"#연봉협상 #이직 #연봉계산기 #실수령액 #직장인",
  "room-planner":"#원룸인테리어 #자취방 #가구배치 #방꾸미기 #이사준비 #침대사이즈",
  "resignation-timing":"#퇴사 #퇴직금 #연차수당 #직장인 #퇴사준비",
  "couple-referee":"#커플 #연애 #커플싸움 #연애고민",
  "minecraft-seeds":"#마인크래프트 #마크시드 #마인크래프트시드 #게임",
  "fishing-tide":"#낚시 #물때 #바다낚시 #낚시포인트 #초보낚시",
  "map-archery":"#여행 #국내여행 #여행지추천 #주말여행",
  "wiki-rabbithole":"#비행기 #오프라인 #장거리비행 #읽을거리 #여행준비",
  "keyword-checker":"#블로그 #SEO #키워드 #블로그운영"
};

function caption(tool){
  if (tool.kind === "story"){
    /* 소재 캡션 — 도구를 밀지 않는다(1단계 전략).
       출처 표기는 넣지 않는다(태현님 요청) — 논문이 아니라 썰이라서. */
    return tool.hook.replace(/\n/g," ") + "\n\n"
      + tool.cards.map(function(c){ return "· " + c.t; }).join("\n")
      + "\n\n" + tool.ask.replace(/\n/g," ")
      + "\n\n" + tool.tags + " #각잡살림";
  }
  return tool.hook.replace(/\n/g," ") + "\n\n"
    + tool.cards.map(function(c){ return "· " + c.t + " — " + c.b.split("\n")[0]; }).join("\n")
    + "\n\n설치도 회원가입도 없이 브라우저에서 바로 쓸 수 있어요.\n"
    /* ⚠️ 인스타 캡션의 URL 은 클릭이 안 된다. 주소를 적어두면 "받아적어서 치라"는 뜻이
       되어 대부분 이탈한다. 실제로 눌리는 프로필 링크로만 유도한다. */
    + "👉 프로필 링크(@) 누르고 «" + tool.no + "번 " + tool.name + "» 탭!\n"
    + "   저장해두면 필요할 때 바로 찾을 수 있어요 🔖\n\n"
    + (TAGS[tool.id] || "") + " #무료도구 #웹툴 #각잡살림";
}

var sheet = document.getElementById("sheet");
var sel   = document.getElementById("tool");
var cur;

/* 퍼널 단계 — 태현님 설계. 이 라벨은 **화면에서만** 쓰고 카드 이미지에는 안 넣는다
   (보는 사람에게는 의미 없는 내부 분류라서). 도구 카드는 마지막 단계로 본다. */
var STAGES = ["소재", "소재>고민", "소재>고민>툴", "소재>툴", "툴>고민해결"];
var STAGE_COLOR = {
  "소재":"#3DD68C", "소재>고민":"#5FB8E3", "소재>고민>툴":"#C9A227",
  "소재>툴":"#E2934A", "툴>고민해결":"#C4636C"
};

/* 소재(story)를 먼저, 그다음 도구를 번호순으로. 지금은 "소재로 후킹" 단계다. */
var ALL = (window.CARD_STORIES || []).concat(
  CARD_TOOLS.slice().sort(function(a,b){ return a.no.localeCompare(b.no); })
    .map(function(t){ t.stage = t.stage || "툴>고민해결"; return t; })
);

function fillSelect(filter){
  sel.innerHTML = "";
  ALL.forEach(function(t,i){
    if (filter && t.stage !== filter) return;
    var o = document.createElement("option");
    o.value = i;
    o.textContent = "[" + t.stage + "] " + ((t.kind === "story")
      ? "📖 " + t.name + " · " + t.hook.split("\n")[0]
      : t.no + "번 " + t.emoji + " " + t.name);
    sel.appendChild(o);
  });
}

/* 단계 필터 버튼 */
var bar = document.getElementById("stagebar");
[""].concat(STAGES).forEach(function(st){
  var b = document.createElement("button");
  b.className = "chip" + (st === "" ? " on" : "");
  b.textContent = st === "" ? "전체" : st;
  if (st) b.style.borderColor = STAGE_COLOR[st];
  b.addEventListener("click", function(){
    Array.prototype.forEach.call(bar.children, function(x){ x.classList.remove("on"); });
    b.classList.add("on");
    fillSelect(st);
    if (sel.options.length) { sel.selectedIndex = 0; render(); }
    else { sheet.innerHTML = "<p class='muted' style='padding:10px'>이 단계의 카드가 아직 없습니다. 만들어 드릴까요?</p>"; }
  });
  bar.appendChild(b);
});
fillSelect("");

function render(){
  cur = ALL[sel.value|0];
  sheet.innerHTML = "";
  for (var i=0; i<=cur.cards.length; i++){
    (function(i){
      var fig = document.createElement("figure");
      var cv  = document.createElement("canvas");
      var cap = document.createElement("figcaption");
      cap.textContent = i===0 ? "표지" : (i + "번째");
      fig.appendChild(cv); fig.appendChild(cap); sheet.appendChild(fig);
      drawCard(cv, cur, i);
    })(i);
  }
  document.getElementById("cap").value = caption(cur);
  document.getElementById("status").textContent =
    "[" + cur.stage + "] " + (cur.cards.length + 1) + "장 · 1080×1080";
}

document.getElementById("dl").addEventListener("click", function(){
  var cvs = sheet.querySelectorAll("canvas");
  var st = document.getElementById("status");
  st.textContent = "저장 중…";
  cvs.forEach(function(cv, i){
    cv.toBlob(function(blob){
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = cur.id + "-" + String(i+1).padStart(2,"0") + ".png";
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
      if (i === cvs.length-1) st.textContent = cvs.length + "장 저장 완료";
    }, "image/png");
  });
});

sel.addEventListener("change", render);

/* ⚠️ 폰트가 준비된 뒤에 그려야 Pretendard 로 찍힌다.
   다만 document.fonts 가 없는 브라우저(구형 삼성인터넷 등)에서는 이 줄이 예외를
   던지면서 **화면이 통째로 비어버린다.** 실제로 모바일에서 아무것도 안 뜨는
   일이 있었다(2026-08-05). 없으면 그냥 바로 그린다.
   또 폰트 로딩이 지연돼도 3초 뒤에는 그린다 — 안 그려지는 것보다 낫다. */
function boot(){
  try { render(); }
  catch (e) { showFatal("화면을 그리다 문제가 생겼어요: " + (e && e.message)); }
}
if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
  var drawn = false;
  var once = function(){ if (drawn) return; drawn = true; boot(); };
  document.fonts.ready.then(once)["catch"](once);
  setTimeout(once, 3000);
} else {
  boot();
}
</script>
</body>
</html>
